name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Ensure Rust Toolchain (preinstalled or resilient fallback)
        shell: bash
        run: |
          if command -v rustc >/dev/null 2>&1; then
            rustc --version
          else
            curl --proto '=https' --tlsv1.2 -sSf --retry 5 --retry-all-errors https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            "$HOME/.cargo/bin/rustc" --version
          fi

      - name: Verify pure-Go static analysis (go vet)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Run full test suite (Linux / macOS with -race)
        if: runner.os != 'Windows'
        run: go test -v -race -count=1 ./...

      - name: Run full test suite (Windows pure-Go)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: go test -v -count=1 ./...

      - name: Build CLI binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.Version=ci" ./cmd/symforge
